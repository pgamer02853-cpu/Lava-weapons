name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/rizgamer/lavaweapons src/main/resources
          mv *.java src/main/java/com/rizgamer/lavaweapons/
          mv plugin.yml config.yml src/main/resources/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: LavaWeapons-jar
          path: target/LavaWeapons-1.0.jar
