  meteor_storm: 90
  volcanic_leap: 20
  volcanic_slam: 60
  ember_lunge: 0.4
  impale_charge: 15
  holy_aegis: 180
  divine_volcano: 1800
  godfall_smash: 60
  null_zone: 3600
damage:
  lava-blade: 16
  lava-hammer: 16
  lava-spear: 16
  meteor: 24
  impale-charge: 24
  volcano-pulse: 14
fire-seconds: 5
